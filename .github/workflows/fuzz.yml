---
name: fuzz

"on":
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: square
            package: .
          - name: share
            package: ./share
          - name: inclusion
            package: ./inclusion
          - name: tx
            package: ./tx
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
      - name: Locate fuzz cache
        id: cache
        run: echo "path=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - name: Restore fuzz corpus
        uses: actions/cache@v6
        with:
          path: ${{ steps.cache.outputs.path }}
          key: fuzz-${{ runner.os }}-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: fuzz-${{ runner.os }}-${{ matrix.name }}-
      - name: Fuzz
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZTIME: 5m
        run: make fuzz
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures-${{ matrix.name }}-${{ github.run_id }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 30
