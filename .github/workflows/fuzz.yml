---
name: fuzz

"on":
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: square
            package: .
          - name: share
            package: ./share
          - name: inclusion
            package: ./inclusion
          - name: tx
            package: ./tx
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
      - name: Locate fuzz cache
        id: cache
        run: echo "path=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - name: Restore fuzz corpus
        uses: actions/cache@v6
        with:
          path: ${{ steps.cache.outputs.path }}
          key: fuzz-${{ runner.os }}-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: fuzz-${{ runner.os }}-${{ matrix.name }}-
      - name: Fuzz
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZTIME: 5m
          # Crash output may describe an exploitable bug, so it stays out of
          # public logs and artifacts and is sent only to Linear.
          FUZZ_LOG_DIR: ${{ runner.temp }}/fuzz
        run: make fuzz
      - name: File Linear issues for failing targets
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: PROTOCO
          LINEAR_ASSIGNEE_ID: ${{ vars.FUZZ_LINEAR_ASSIGNEE_ID || 'e9929f5b-e156-4046-95df-aeea6faa9a58' }}
          FUZZ_LOG_DIR: ${{ runner.temp }}/fuzz
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          TITLE_PREFIX: Nightly go-square fuzz failure
        run: python3 .github/scripts/report-fuzz-failures.py
