name: test
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # test runs on the Go version in go.mod, the lowest that importers may use.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod

      - name: Test fuzz script
        run: bash scripts/fuzz_test.sh

      - name: Run tests
        run: go test ./... -v -timeout 5m -race

  # test-latest-go runs the tests on the newest supported Go release and
  # uploads coverage. Coverage comes from this job only: Go releases split code
  # into coverage blocks differently, so mixing them moves the percentage. See
  # "Go version" in README.md.
  test-latest-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Run tests
        run: go test ./... -v -timeout 5m -race -coverprofile=coverage.txt -covermode=atomic

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage.txt
          use_oidc: true
