syntax = "proto3";
package proto.cosmos.tx.v1beta1;

import "google/protobuf/any.proto";

option go_package = "github.com/celestiaorg/go-square/v4/proto/cosmos/tx/v1beta1";

// TxRaw is the transaction as it travels on the wire, and mirrors the message
// the Cosmos SDK decodes raw transaction bytes into. This is a minimal subset of
// the full cosmos.tx.v1beta1.TxRaw, containing only the fields needed by
// go-square, but the wire-level shape is deliberately identical: go-square and
// the SDK must never disagree about what a given set of transaction bytes says.
//
// Modelling body_bytes as a scalar `bytes` field rather than an embedded TxBody
// message is the load-bearing part. Repeated occurrences of a scalar field
// resolve to the last one, whereas repeated occurrences of a message field are
// merged and their inner repeated fields concatenated. Only the former matches
// the SDK.
message TxRaw {
  // body_bytes is a protobuf serialization of a TxBody that matches the
  // representation in SignDoc.
  bytes body_bytes = 1;

  // auth_info_bytes is a protobuf serialization of an AuthInfo that matches the
  // representation in SignDoc. go-square does not decode it; it is declared so
  // that this message stays a faithful view of the bytes the SDK sees.
  bytes auth_info_bytes = 2;

  // signatures is a list of signatures that matches the length and order of
  // AuthInfo's signer_infos to allow connecting signature meta information like
  // public key and signing mode by position.
  repeated bytes signatures = 3;
}

// TxBody is the body of a transaction that all signers sign over.
// This is a minimal subset containing only the messages field.
message TxBody {
  repeated google.protobuf.Any messages = 1;
}

// Tx models the body as an embedded message, which does NOT match how the
// Cosmos SDK reads the same wire field. Decoding transaction bytes through this
// message can reach a different answer than the SDK does about which messages a
// transaction contains. Decode through TxRaw instead.
//
// Retained only so that removing it is not a breaking change for the published
// module; nothing in go-square uses it.
message Tx {
  option deprecated = true;

  TxBody body = 1;
}
